name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Self audit
        run: npm run audit:self

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-audit-evidence
          path: .code-audit/self
          if-no-files-found: warn
